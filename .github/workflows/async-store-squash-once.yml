name: Squash async Store PR commits once

on:
  push:
    branches:
      - work/async-store-batch-get-rfc5668
    paths:
      - .github/workflows/async-store-squash-once.yml

permissions:
  contents: write

jobs:
  squash:
    if: github.actor == 'devinhuang2001'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout complete branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Squash assistant-generated draft history with matching DCO
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          original="$(git rev-parse HEAD)"
          git config user.name "devin huang"
          git config user.email "akahuang666@gmail.com"
          git reset --soft origin/main
          git rm -- .github/workflows/async-store-squash-once.yml
          git commit -s -m "feat(store): implement bounded native async batch get (RFC #5668)"
          git push --force-with-lease="refs/heads/work/async-store-batch-get-rfc5668:${original}" \
            origin HEAD:refs/heads/work/async-store-batch-get-rfc5668

# Final RFC 5668 draft consolidation trigger.
